[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spotui"
version = "0.1.0"
description = "Spotify terminal UI for macOS — album art, cava audio visualizer, palette theming, lyrics"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Vince Vasile" }]
keywords = ["spotify", "tui", "terminal", "textual", "cava", "visualizer"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "rich>=13.0",
    "spotipy>=2.25",
    "textual>=8.0",
    "textual-image>=0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
spotui = "spotui.__main__:main"

[project.urls]
Repository = "https://github.com/vincevasile/spotui"

[tool.hatch.build.targets.wheel]
packages = ["src/spotui"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
